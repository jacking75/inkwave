<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INKWAVE</title>
  <link rel="stylesheet" href="./desktop/launcher.css">
</head>
<body>
  <main>
    <p class="brand">INKWAVE</p>
    <h1>게임 시작 준비</h1>
    <p>이 시작 화면에서는 게임과 3D 배경을 불러오지 않는다.</p>
    <p class="notice">제한된 성능 설정으로 시작한다. 메뉴 자동 전투와 전체 효과 사전 준비를 생략하고 바닥 재질의 세부 표현을 단순화한다. 캐릭터는 현재 보이는 모습부터 준비하고 장비 화면은 열 때 준비한다. 메뉴는 최대 30fps, 전투는 기본 60fps로 제한한다.</p>
    <p>게임 시작을 누르면 낮은 화질로 게임을 불러온다. 직접 선택하지 않은 그림자는 끈다. 기존 앱의 설정·프로필은 자동으로 이전되지 않으며 원본은 보존된다.</p>
    <button id="launch" type="button">게임 시작</button>
  </main>
  <script type="module" src="./desktop/launcher.js"></script>
</body>
</html>
