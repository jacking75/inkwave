<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INKWAVE</title>
  <link rel="stylesheet" href="./desktop/launcher.css">
</head>
<body>
  <main>
    <p class="brand">INKWAVE</p>
    <h1>게임 시작 준비</h1>
    <p>이 시작 화면에서는 게임과 3D 배경을 불러오지 않는다.</p>
    <p class="notice">로딩·렉·게임패드 문제 수정은 아직 진행 전이다. 호스트 변경만으로 성능 문제가 해결된 것은 아니므로, 수정과 실행 조건 확인 전에는 게임을 시작하지 않는다.</p>
    <p>게임 시작을 누르면 낮은 화질로 기존 게임을 불러온다. 기존 앱의 설정·프로필은 자동으로 이전되지 않으며 원본은 보존된다.</p>
    <button id="launch" type="button">게임 시작</button>
  </main>
  <script type="module" src="./desktop/launcher.js"></script>
</body>
</html>
