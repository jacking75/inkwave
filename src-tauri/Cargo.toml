[package]
name = "inkwave-desktop"
version = "1.1.0"
description = "INKWAVE Tauri 데스크톱 호스트"
edition = "2021"
rust-version = "1.89"
license = "MIT"

# Android(모바일 셸)는 공유 라이브러리로, 데스크톱은 같은 라이브러리를 실행 파일이 부른다
[lib]
name = "inkwave_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-opener = "=2.5.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
