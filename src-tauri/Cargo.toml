[package]
name = "inkwave-desktop"
version = "1.1.0"
description = "INKWAVE Tauri 데스크톱 호스트"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.6", features = [] }
tauri-plugin-opener = "=2.5.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
